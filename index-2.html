<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingFlow | Creative Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --surface-dark: #1e1e1e;
            --surface-hover: #282828;
            --border-color: #333333;
            --text-main: #f5f5f5;
            --text-muted: #aaaaaa;
            
            /* Burger King Brand Palette */
            --bk-red: #D52B1E;
            --bk-orange: #F58220;
            --bk-brown: #502314;
            --bk-cream: #F5EBE0;
            --bk-green: #2B7A3D;
            --bk-yellow: #FFB800;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: 260px;
            background-color: var(--surface-dark);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-left: 8px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--bk-red), var(--bk-orange));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--bk-cream);
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(213, 43, 30, 0.3);
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: var(--bk-cream);
            letter-spacing: 0.5px;
        }

        .logo-text span {
            font-size: 11px;
            color: var(--bk-orange);
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-section {
            margin-bottom: 24px;
        }

        .nav-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 8px;
            font-weight: 600;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--surface-hover);
            color: var(--bk-cream);
        }

        .nav-item.active {
            border-left: 3px solid var(--bk-orange);
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        header {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--surface-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .header-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--bk-cream);
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            background-color: var(--bk-red);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--surface-hover);
            color: var(--bk-cream);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        /* Content Scroll Area */
        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* Dashboard View */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .kpi-card {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
        }

        .kpi-card.c1::before { background-color: #888888; }
        .kpi-card.c2::before { background-color: var(--bk-orange); }
        .kpi-card.c3::before { background-color: var(--bk-yellow); }
        .kpi-card.c4::before { background-color: var(--bk-green); }
        .kpi-card.c5::before { background-color: #2196F3; }

        .kpi-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--bk-cream);
            margin-top: 8px;
        }

        /* Table & Groups */
        .group-container {
            margin-bottom: 32px;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .group-header {
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
        }

        .group-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .group-badge {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .group-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--bk-cream);
            background: transparent;
            border: none;
            outline: none;
        }

        .group-name:focus {
            border-bottom: 1px dashed var(--bk-orange);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }

        th {
            background-color: var(--surface-hover);
            color: var(--text-muted);
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.01);
        }

        /* Editable Inputs & Selects */
        input[type="text"], input[type="date"], select {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 4px;
            width: 100%;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:hover, input[type="date"]:hover, select:hover {
            border-color: var(--border-color);
            background-color: rgba(255, 255, 255, 0.03);
        }

        input[type="text"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--bk-orange);
            background-color: rgba(255, 255, 255, 0.05);
        }

        select option {
            background-color: var(--surface-dark);
            color: var(--text-main);
        }

        /* Multi-select Dropdown styling */
        .multi-select-container {
            position: relative;
            min-width: 150px;
        }
        .multi-select-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .multi-select-btn:hover {
            border-color: var(--border-color);
            background-color: rgba(255, 255, 255, 0.03);
        }
        .multi-dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: var(--surface-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 100;
            padding: 8px;
            min-width: 160px;
        }
        .multi-dropdown-content.show {
            display: block;
        }
        .multi-dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 4px;
        }
        .multi-dropdown-item:hover {
            background-color: var(--surface-hover);
        }

        /* Status Pills */
        .status-pill {
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 11px;
            text-align: center;
            display: inline-block;
            cursor: pointer;
            border: none;
            outline: none;
            width: 110px;
        }

        .status-Por-iniciar { background-color: #444444; color: #f5f5f5; }
        .status-En-proceso { background-color: var(--bk-orange); color: #121212; }
        .status-En-revision { background-color: var(--bk-yellow); color: #121212; }
        .status-Aprobado { background-color: var(--bk-green); color: #ffffff; }
        .status-Entregado { background-color: #2196F3; color: #ffffff; }

        .link-cell a {
            color: var(--bk-orange);
            text-decoration: none;
            font-weight: 500;
        }
        .link-cell a:hover {
            text-decoration: underline;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--bk-red);
            background-color: rgba(213, 43, 30, 0.1);
        }

        .add-row-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--bk-orange);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            transition: background 0.2s;
        }

        .add-row-btn:hover {
            background-color: rgba(245, 130, 32, 0.05);
        }

        /* Image Preview Thumbnail */
        .img-preview-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .thumb-img {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .file-input-label {
            font-size: 11px;
            color: var(--bk-orange);
            cursor: pointer;
            background: rgba(245, 130, 32, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px dashed var(--bk-orange);
        }

        .file-input-label:hover {
            background: rgba(245, 130, 32, 0.2);
        }

        /* Modal Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside>
        <div class="logo-area">
            <div class="logo-icon">KF</div>
            <div class="logo-text">
                <h1>KingFlow</h1>
                <span>Creative Studio OS</span>
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-title">Vistas Principales</div>
            <div class="nav-item active" onclick="switchView('master')">
                <span>⚡</span> Tablero General
            </div>
            <div class="nav-item" onclick="switchView('dashboard')">
                <span>📊</span> Dashboard de Métricas
            </div>
        </div>

        <div class="nav-section">
            <div class="nav-title">Campañas Activas</div>
            <div id="sidebar-campaigns-list">
                <!-- Dinámico -->
            </div>
        </div>

        <div style="margin-top: auto;">
            <button class="btn" style="width: 100%; justify-content: center;" onclick="addNewCampaignGroup()">
                + Nueva Campaña
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main>
        <header>
            <div class="header-title">
                <h2 id="header-main-title">Tablero General de Operaciones</h2>
                <p id="header-main-subtitle">Gestión integral de diseño, campañas y entregables - Estilo Monday x Burger King</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="resetToDefaultData()">Restaurar Ejemplo</button>
                <button class="btn" onclick="addNewCampaignGroup()">+ Agregar Grupo</button>
            </div>
        </header>

        <div class="content-body" id="main-content-scroll">
            <!-- Dinámico -->
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Referencia Ampliada">
    </div>

<script>
    // Equipo solicitado (Multiselección habilitada)
    const equipo = [
        "Esteban", "Andy", "Barbara", "Liz", 
        "Silvia", "Tania", "Sebas", "Jenny"
    ];

    const canales = [
        "Redes Sociales", "Digital / Meta", "Exterior / Vallas", "Email Marketing", 
        "Prensa y Revistas", "TV / Audiovisual", "Radio", "Punto de Venta", 
        "Influencers", "Sitio Web"
    ];

    const statuses = ["Por iniciar", "En proceso", "En revisión", "Aprobado", "Entregado"];

    // Estructura inicial por defecto
    const defaultData = [
        {
            id: "camp_1",
            name: "Campaña Aniversario 80 (Noviembre)",
            color: "#D52B1E",
            tasks: [
                { id: tId(), campaign: "Campaña Aniversario 80", canal: "Redes Sociales", ingreso: "2026-11-01", limite: "2026-11-10", solicitante: ["Andy", "Barbara"], detalle: "Diseño de post carrusel", entregable: "Arte Final", num: 3, medida: "1080x1080", entrega: "2026-11-08", estatus: "En proceso", responsable: ["Esteban", "Jenny"], link: "https://drive.google.com", refImg: "" },
                { id: tId(), campaign: "Campaña Aniversario 80", canal: "Exterior / Vallas", ingreso: "2026-11-03", limite: "2026-11-12", solicitante: ["Silvia"], detalle: "Adaptación de valla principal", entregable: "Vector", num: 1, medida: "9x3 metros", entrega: "2026-11-11", estatus: "En revisión", responsable: ["Andy", "Sebas"], link: "https://drive.google.com", refImg: "" }
            ]
        },
        {
            id: "camp_2",
            name: "Lanzamiento Otoño (Octubre)",
            color: "#F58220",
            tasks: [
                { id: tId(), campaign: "Lanzamiento Otoño", canal: "Digital / Meta", ingreso: "2026-10-15", limite: "2026-10-25", solicitante: ["Tania", "Liz"], detalle: "Banner promocional web", entregable: "PSD/JPG", num: 5, medida: "1200x628", entrega: "2026-10-24", estatus: "Aprobado", responsable: ["Esteban"], link: "https://drive.google.com", refImg: "" },
                { id: tId(), campaign: "Lanzamiento Otoño", canal: "Email Marketing", ingreso: "2026-10-18", limite: "2026-10-28", solicitante: ["Barbara"], detalle: "Newsletter mensual", entregable: "HTML/Diseño", num: 1, medida: "Responsive", entrega: "2026-10-27", estatus: "Entregado", responsable: ["Liz", "Jenny"], link: "https://drive.google.com", refImg: "" }
            ]
        }
    ];

    function tId() {
        return 'task_' + Math.random().toString(36).substr(2, 9);
    }

    let campaigns = JSON.parse(localStorage.getItem('kingflow_campaigns')) || defaultData;
    let currentView = 'master';

    function saveData() {
        localStorage.setItem('kingflow_campaigns', JSON.stringify(campaigns));
        render();
    }

    function resetToDefaultData() {
        if(confirm("¿Restaurar los datos de ejemplo originales?")) {
            campaigns = JSON.parse(JSON.stringify(defaultData));
            saveData();
        }
    }

    function switchView(view) {
        currentView = view;
        render();
    }

    function addNewCampaignGroup() {
        const name = prompt("Nombre de la nueva campaña / grupo:");
        if(!name) return;
        const colors = ["#D52B1E", "#F58220", "#FFB800", "#2B7A3D", "#502314"];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        
        campaigns.push({
            id: 'camp_' + Date.now(),
            name: name,
            color: randomColor,
            tasks: []
        });
        saveData();
    }

    function deleteCampaignGroup(campId) {
        if(confirm("¿Eliminar este grupo de campaña completo con todas sus tareas?")) {
            campaigns = campaigns.filter(c => c.id !== campId);
            saveData();
        }
    }

    function addNewTask(campId) {
        const camp = campaigns.find(c => c.id === campId);
        if(!camp) return;
        
        camp.tasks.push({
            id: tId(),
            campaign: camp.name,
            canal: canales[0],
            ingreso: new Date().toISOString().split('T')[0],
            limite: new Date().toISOString().split('T')[0],
            solicitante: [equipo[0]],
            detalle: "Nueva tarea de diseño",
            entregable: "Arte Final",
            num: 1,
            medida: "1080x1080",
            entrega: new Date().toISOString().split('T')[0],
            estatus: "Por iniciar",
            responsable: [equipo[1]],
            link: "https://",
            refImg: ""
        });
        saveData();
    }

    function deleteTask(campId, taskId) {
        const camp = campaigns.find(c => c.id === campId);
        if(!camp) return;
        camp.tasks = camp.tasks.filter(t => t.id !== taskId);
        saveData();
    }

    function updateTaskField(campId, taskId, field, value) {
        const camp = campaigns.find(c => c.id === campId);
        if(!camp) return;
        const task = camp.tasks.find(t => t.id === taskId);
        if(!task) return;
        
        task[field] = value;
        
        localStorage.setItem('kingflow_campaigns', JSON.stringify(campaigns));
        if(field === 'estatus') {
            render();
        }
    }

    function toggleTeamMember(campId, taskId, field, member) {
        const camp = campaigns.find(c => c.id === campId);
        if(!camp) return;
        const task = camp.tasks.find(t => t.id === taskId);
        if(!task) return;

        if(!Array.isArray(task[field])) {
            task[field] = [];
        }

        const idx = task[field].indexOf(member);
        if(idx > -1) {
            task[field].splice(idx, 1);
        } else {
            task[field].push(member);
        }
        
        saveData();
    }

    function toggleDropdown(elId) {
        const drop = document.getElementById(elId);
        // Cerrar otros abiertos
        document.querySelectorAll('.multi-dropdown-content').forEach(d => {
            if(d.id !== elId) d.classList.remove('show');
        });
        drop.classList.toggle('show');
    }

    // Cerrar dropdown al hacer clic fuera
    window.onclick = function(event) {
        if (!event.target.closest('.multi-select-container')) {
            document.querySelectorAll('.multi-dropdown-content').forEach(d => d.classList.remove('show'));
        }
    }

    function updateCampName(campId, newName) {
        const camp = campaigns.find(c => c.id === campId);
        if(camp) {
            camp.name = newName;
            localStorage.setItem('kingflow_campaigns', JSON.stringify(campaigns));
        }
    }

    function handleImageUpload(event, campId, taskId) {
        const file = event.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const camp = campaigns.find(c => c.id === campId);
            if(camp) {
                const task = camp.tasks.find(t => t.id === taskId);
                if(task) {
                    task.refImg = e.target.result;
                    saveData();
                }
            }
        };
        reader.readAsDataURL(file);
    }

    function openLightbox(imgSrc) {
        if(!imgSrc) return;
        document.getElementById('lightbox-img').src = imgSrc;
        document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
    }

    // Render Engine
    function render() {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(currentView === 'master') document.querySelectorAll('.nav-item')[0].classList.add('active');
        if(currentView === 'dashboard') document.querySelectorAll('.nav-item')[1].classList.add('active');

        const sbList = document.getElementById('sidebar-campaigns-list');
        sbList.innerHTML = campaigns.map(c => `
            <div class="nav-item" onclick="switchView('master')">
                <span style="width: 8px; height: 8px; border-radius: 50%; background-color: ${c.color}"></span>
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${c.name}</span>
            </div>
        `).join('');

        const container = document.getElementById('main-content-scroll');
        const mainTitle = document.getElementById('header-main-title');
        const mainSubtitle = document.getElementById('header-main-subtitle');

        if(currentView === 'dashboard') {
            mainTitle.innerText = "Dashboard de Métricas & Rendimiento";
            mainSubtitle.innerText = "Resumen en tiempo real del estado de tus campañas y carga de equipo";
            
            let totalTasks = 0;
            let counts = { "Por iniciar": 0, "En proceso": 0, "En revisión": 0, "Aprobado": 0, "Entregado": 0 };
            
            campaigns.forEach(c => {
                c.tasks.forEach(t => {
                    totalTasks++;
                    if(counts[t.estatus] !== undefined) counts[t.estatus]++;
                });
            });

            container.innerHTML = `
                <div class="dashboard-grid">
                    <div class="kpi-card c1">
                        <div class="kpi-title">Por Iniciar</div>
                        <div class="kpi-value">${counts["Por iniciar"]}</div>
                    </div>
                    <div class="kpi-card c2">
                        <div class="kpi-title">En Proceso</div>
                        <div class="kpi-value">${counts["En proceso"]}</div>
                    </div>
                    <div class="kpi-card c3">
                        <div class="kpi-title">En Revisión</div>
                        <div class="kpi-value">${counts["En revisión"]}</div>
                    </div>
                    <div class="kpi-card c4">
                        <div class="kpi-title">Aprobados</div>
                        <div class="kpi-value">${counts["Aprobado"]}</div>
                    </div>
                    <div class="kpi-card c5">
                        <div class="kpi-title">Entregados</div>
                        <div class="kpi-value">${counts["Entregado"]}</div>
                    </div>
                </div>
                <div style="background: var(--surface-dark); border: 1px solid var(--border-color); border-radius: 10px; padding: 24px; text-align: center;">
                    <h3 style="color: var(--bk-cream); margin-bottom: 8px;">Total de Tareas Registradas: ${totalTasks}</h3>
                    <p style="color: var(--text-muted); font-size: 13px;">Todas las métricas se sincronizan instantáneamente con los cambios en los tableros de campaña.</p>
                </div>
            `;
            return;
        }

        mainTitle.innerText = "Tablero General de Operaciones";
        mainSubtitle.innerText = "Organización por campañas, canales, responsables múltiples y entregables en tiempo real";

        container.innerHTML = campaigns.map(camp => `
            <div class="group-container">
                <div class="group-header">
                    <div class="group-title-wrapper">
                        <div class="group-badge" style="background-color: ${camp.color};"></div>
                        <input type="text" class="group-name" value="${camp.name}" onchange="updateCampName('${camp.id}', this.value)" style="width: 320px;">
                        <span style="font-size: 12px; color: var(--text-muted); font-weight: 500;">(${camp.tasks.length} tareas)</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn-secondary" style="padding: 6px 12px; font-size: 11px;" onclick="addNewTask('${camp.id}')">+ Tarea</button>
                        <button class="icon-btn" onclick="deleteCampaignGroup('${camp.id}')" title="Eliminar Campaña">🗑️</button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 40px;">#</th>
                                <th>CAMPAÑA</th>
                                <th>CANAL</th>
                                <th>FECHA INGRESO</th>
                                <th>FECHA LÍMITE</th>
                                <th>SOLICITANTE</th>
                                <th>DETALLE</th>
                                <th>ENTREGABLE</th>
                                <th>CANT.</th>
                                <th>MEDIDA</th>
                                <th>FECHA ENTREGA</th>
                                <th>ESTATUS</th>
                                <th>RESPONSABLE</th>
                                <th>LINK</th>
                                <th>REFERENCIA</th>
                                <th style="width: 50px;">ACCION</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${camp.tasks.map((t, idx) => {
                                const solList = Array.isArray(t.solicitante) ? t.solicitante : [t.solicitante || 'Esteban'];
                                const respList = Array.isArray(t.responsable) ? t.responsable : [t.responsable || 'Andy'];
                                const solId = `sol_${camp.id}_${t.id}`;
                                const respId = `resp_${camp.id}_${t.id}`;

                                return `
                                <tr>
                                    <td style="color: var(--text-muted); text-align: center;">${idx + 1}</td>
                                    <td><input type="text" value="${t.campaign}" onchange="updateTaskField('${camp.id}', '${t.id}', 'campaign', this.value)"></td>
                                    <td>
                                        <select onchange="updateTaskField('${camp.id}', '${t.id}', 'canal', this.value)">
                                            ${canales.map(cn => `<option value="${cn}" ${t.canal === cn ? 'selected':''}>${cn}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td><input type="date" value="${t.ingreso}" onchange="updateTaskField('${camp.id}', '${t.id}', 'ingreso', this.value)"></td>
                                    <td><input type="date" value="${t.limite}" onchange="updateTaskField('${camp.id}', '${t.id}', 'limite', this.value)"></td>
                                    <td>
                                        <div class="multi-select-container">
                                            <div class="multi-select-btn" onclick="toggleDropdown('${solId}')">
                                                👤 ${solList.join(', ') || 'Seleccionar...'}
                                            </div>
                                            <div id="${solId}" class="multi-dropdown-content">
                                                ${equipo.map(m => `
                                                    <div class="multi-dropdown-item" onclick="toggleTeamMember('${camp.id}', '${t.id}', 'solicitante', '${m}')">
                                                        <input type="checkbox" ${solList.includes(m) ? 'checked' : ''} onclick="event.stopPropagation(); toggleTeamMember('${camp.id}', '${t.id}', 'solicitante', '${m}')">
                                                        ${m}
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </td>
                                    <td><input type="text" value="${t.detalle}" onchange="updateTaskField('${camp.id}', '${t.id}', 'detalle', this.value)"></td>
                                    <td><input type="text" value="${t.entregable}" onchange="updateTaskField('${camp.id}', '${t.id}', 'entregable', this.value)"></td>
                                    <td><input type="text" style="width: 50px; text-align: center;" value="${t.num}" onchange="updateTaskField('${camp.id}', '${t.id}', 'num', this.value)"></td>
                                    <td><input type="text" value="${t.medida}" onchange="updateTaskField('${camp.id}', '${t.id}', 'medida', this.value)"></td>
                                    <td><input type="date" value="${t.entrega}" onchange="updateTaskField('${camp.id}', '${t.id}', 'entrega', this.value)"></td>
                                    <td>
                                        <select class="status-pill status-${t.estatus.replace(/\s+/g, '-')}" onchange="updateTaskField('${camp.id}', '${t.id}', 'estatus', this.value)">
                                            ${statuses.map(s => `<option value="${s}" ${t.estatus === s ? 'selected':''}>${s}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td>
                                        <div class="multi-select-container">
                                            <div class="multi-select-btn" onclick="toggleDropdown('${respId}')">
                                                👥 ${respList.join(', ') || 'Seleccionar...'}
                                            </div>
                                            <div id="${respId}" class="multi-dropdown-content">
                                                ${equipo.map(m => `
                                                    <div class="multi-dropdown-item" onclick="toggleTeamMember('${camp.id}', '${t.id}', 'responsable', '${m}')">
                                                        <input type="checkbox" ${respList.includes(m) ? 'checked' : ''} onclick="event.stopPropagation(); toggleTeamMember('${camp.id}', '${t.id}', 'responsable', '${m}')">
                                                        ${m}
                                                    </div>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </td>
                                    <td class="link-cell"><input type="text" value="${t.link}" onchange="updateTaskField('${camp.id}', '${t.id}', 'link', this.value)"></td>
                                    <td>
                                        <div class="img-preview-wrap">
                                            ${t.refImg ? `<img src="${t.refImg}" class="thumb-img" onclick="openLightbox('${t.refImg}')" title="Ver imagen">` : ''}
                                            <label class="file-input-label">
                                                Subir <input type="file" accept="image/*" style="display:none;" onchange="handleImageUpload(event, '${camp.id}', '${t.id}')">
                                            </label>
                                        </div>
                                    </td>
                                    <td>
                                        <button class="icon-btn" onclick="deleteTask('${camp.id}', '${t.id}')" title="Eliminar Tarea">🗑️</button>
                                    </td>
                                </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
                <button class="add-row-btn" onclick="addNewTask('${camp.id}')">+ Agregar nueva tarea</button>
            </div>
        `).join('');
    }

    render();
</script>
</body>
</html>
